<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cicijastip Management</title>

    <!-- Hubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HALAMAN LOGIN -->
    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <img src="logo.png" alt="Cicijastip Management">
            </div>

            <h1>Cicijastip Management</h1>

            <p>Management Jastip & Keuangan</p>


            <!-- Input Username -->
            <input
                type="text"
                id="username"
                placeholder="Username"
            >


            <!-- Input Password -->
            <input
                type="password"
                id="password"
                placeholder="Password"
            >


            <!-- Tombol Login -->
            <button onclick="login()">
                Login
            </button>

        </div>

    </div>


    <!-- Hubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
